name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: akshar_to_code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Checkout android SDK platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Enable caching
        run: flutter config --no-version-check

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akshar-to-code-debug
          path: akshar_to_code/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akshar-to-code-release
          path: akshar_to_code/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Notify on Success
        if: success()
        run: echo "APK built successfully! Download from the Artifacts tab."